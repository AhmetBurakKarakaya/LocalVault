<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="fixture.css"><title>React</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script></head><body>
<div id="root"></div>
<script>
const e = React.createElement;
function App() {
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  return e('form', { className: 'card', onSubmit: (ev) => ev.preventDefault() },
    e('h1', null, 'React girişi'),
    e('label', { htmlFor: 'email' }, 'E-posta'),
    e('input', { id: 'email', type: 'email', value: email, onChange: (ev) => setEmail(ev.target.value) }),
    e('label', { htmlFor: 'pass' }, 'Parola'),
    e('input', { id: 'pass', type: 'password', value: password, onChange: (ev) => setPassword(ev.target.value) }),
    e('button', null, 'Giriş'),
    e('div', { className: 'state', id: 'state' }, 'React state → email=' + JSON.stringify(email) + ' password=' + JSON.stringify(password)));
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script><script src="../harness.js"></script><script src="../../src/content/forms.js"></script><script src="../../src/content/ui.js"></script><script src="../../src/content/content.js"></script></body></html>

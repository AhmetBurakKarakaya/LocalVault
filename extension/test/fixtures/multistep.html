<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="fixture.css"><title>Çok adımlı giriş</title></head><body>
<form class="card" id="f" action="#"><h1>Oturum açın</h1><div id="step">
<label for="id">E-posta veya telefon</label><input id="id" type="email" name="identifier" autocomplete="username"></div>
<button id="next">İleri</button></form>
<script>
document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  if (document.getElementById('pw')) return;
  document.getElementById('step').innerHTML = '<p>' + document.getElementById('id').value + '</p><label for="pw">Parolanızı girin</label><input id="pw" type="password" name="Passwd" autocomplete="current-password">';
});
</script><script src="../harness.js"></script><script src="../../src/content/forms.js"></script><script src="../../src/content/ui.js"></script><script src="../../src/content/content.js"></script></body></html>
